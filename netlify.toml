[build]
  command = "pnpm build"
  publish = "dist"

[[redirects]]
  from = "/blog/wp-content/*"
  to = "http://blog.jakefrugejrgrant.com/wp-content/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/blog/wp-admin/*"
  to = "http://blog.jakefrugejrgrant.com/wp-admin/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/blog/wp-login.php"
  to = "http://blog.jakefrugejrgrant.com/wp-login.php"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
