<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Netlify Forms Skeleton</title>
</head>
<body>
  <!-- This file is used by Netlify for build-time form detection. -->
  
  <!-- Contact Form -->
  <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="contact" />
    <input type="text" name="name" />
    <input type="email" name="email" />
    <input type="text" name="subject" />
    <textarea name="message"></textarea>
    <input name="bot-field" />
  </form>

  <!-- Apply Form -->
  <form name="apply" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="apply" />
    <input type="text" name="firstName" />
    <input type="text" name="lastName" />
    <input type="email" name="email" />
    <input type="text" name="phone" />
    <input type="date" name="dob" />
    <input type="text" name="street" />
    <input type="text" name="city" />
    <input type="text" name="state" />
    <input type="text" name="zip" />
    <input type="text" name="university" />
    <input type="text" name="programLevel" />
    <input type="text" name="major" />
    <input type="date" name="gradDate" />
    <textarea name="statement"></textarea>
    <input name="bot-field" />
  </form>
</body>
</html>
